name: Chromatic

# Visual regression via Chromatic — snapshots every Storybook story in light
# and dark (modes declared in .storybook/preview.ts) and diffs against the
# accepted baseline.
#
# DELIBERATELY workflow_dispatch-ONLY. The project, CHROMATIC_PROJECT_TOKEN
# secret, and accepted baseline all exist (first baseline 2026-07-27:
# 502 stories x 2 themes). The reason is snapshot budget: a full run is
# roughly twice the story count in snapshots (about 1,330 today) against
# the free tier's 5,000/month, so runs are deliberate, not per-push.
# Revisit the trigger (and TurboSnap) once the real monthly spend is known.
#
# NOT part of `npm run verify` — the one deliberate exception to the "CI
# check ⇒ verify" rule, because every run bills cloud snapshots. See the
# CI & Local Verify section of CLAUDE.md.
#
# fetch-depth: 0 is required — Chromatic walks git history to find the
# ancestor build whose baseline it should compare against.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
