name: CI

# `npm run verify` is the local mirror of this workflow: a check added here
# goes into verify in the same change. Three deliberate exceptions stay
# CI-only: the dependency audit and the drift guard below, and Chromatic
# (chromatic.yml, dispatch-only for its snapshot budget).
#
# Labs (website/src/app/labs/) are noindex surface experiments, made for
# fun. A change that touches nothing else takes a lighter path: the jobs and
# steps marked `labs-only` below stand down, and everything else still runs.
# scripts/labs-only-change.mjs owns the allowlist and the reasoning, and
# `npm run verify:labs` is the local mirror of that path.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo. Nothing here publishes or
# writes, so the default token scope is narrowed to read-only.
permissions:
  contents: read

jobs:
  changes:
    name: Detect a labs-only change
    runs-on: ubuntu-latest
    outputs:
      labs-only: ${{ steps.detect.outputs.labs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Anything it cannot resolve (a new branch, a force push) reads as not
      # labs-only, so the full path runs.
      - id: detect
        run: node scripts/labs-only-change.mjs
        env:
          LABS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  library:
    name: Lint + build library
    needs: changes
    runs-on: ubuntu-latest
    steps:
      # Full history with tags: the API compatibility gate below compares the
      # working tree with the latest release tag, and fails in CI without one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --omit=dev scopes the gate to what ships: the published package and the
      # deployed site. Dev-only tooling (lint, build, test) is deliberately out,
      # because an advisory there with no upstream fix would otherwise hold main
      # red indefinitely and skip every later step in this job (2026-10-07: braces
      # under eslint-config-next, GHSA-vfj7-8cjw-p6xm, no patched version). A
      # plain `npm audit` still reports dev advisories; the dependency-advisory
      # skill owns the response to both kinds.
      - run: npm audit --audit-level=high --omit=dev
        # labs-only: a labs page adds no dependency.
        if: needs.changes.outputs.labs-only != 'true'
      - run: npm run lint
      - run: npm run build
      # Deprecate, never remove: nothing the latest release published may
      # vanish or narrow (props, export names, subpaths, deep-import files,
      # the published schema files and their meta-schema properties).
      - run: node scripts/validate-api-compat.mjs
        # labs-only: a labs page publishes nothing, so the package steps stand down.
        if: needs.changes.outputs.labs-only != 'true'
      - run: npm run build:lib
        if: needs.changes.outputs.labs-only != 'true'
      # publint + arethetypeswrong against dist/: the manifest must match the
      # tarball and every export subpath must resolve for ESM and bundler
      # consumers — resolution modes the Vite consumer smoke never exercises.
      - run: node scripts/validate-package-publish.mjs
        if: needs.changes.outputs.labs-only != 'true'
      # validate-registry (run by prebuild) regenerates README/skills/barrel
      # content; a dirty tree here means committed generated content is stale.
      # CI-only: a local tree is dirty with the change in progress, so verify
      # cannot run this guard.
      - name: Check generated content is committed
        # `git diff` alone misses a generated file that is new (a component's
        # first schema, a preset's DTCG pair), so untracked files fail too.
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  test:
    name: Story tests
    needs: changes
    # labs-only: a labs page has no stories.
    if: needs.changes.outputs.labs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test

  storybook:
    name: Build Storybook
    needs: changes
    # labs-only: a labs page is not in Storybook.
    if: needs.changes.outputs.labs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook

  website:
    name: Build website
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm workspaces: the root install covers the website (and links
      # rift-ds into its node_modules).
      - run: npm ci
      - run: npm run lint
        working-directory: website
      - run: npm run build
        working-directory: website
      # Reads the prerendered HTML, so it has to follow the build rather than
      # ride the prebuild validator chain.
      - run: node scripts/validate-rendered-spacing.mjs
      # Same reason: compares the corpus against what the pages actually render.
      - run: node scripts/validate-corpus-coverage.mjs
      # Every internal href in the prerendered HTML must lead to a page,
      # route handler, public file, or redirect that exists.
      - run: node scripts/validate-internal-links.mjs
      # Serves the build and loads it in a real browser: hydration must
      # succeed and the page must be visible with content. HTTP 200 and a
      # green build prove neither — the 2026-09-06 outage served 200 while
      # every JS browser showed a blank page.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-hydration.mjs
      # Drives every drag grip on the served site with a 250Hz pointer flood
      # under CPU throttling and fails on a page error, an empty body or a
      # run of React commits that ends with work still pending. A rendered
      # page proves nothing about a grip: on 2026-10-20 the playground's
      # resize grip blanked the live site under a real drag, twice.
      - run: node scripts/validate-gestures.mjs
        # labs-only: these two sweep the whole served site. A labs change can
        # only reach its own noindex pages (a few lab grips and lab routes are
        # in their sets), and the lighter path accepts that risk for an
        # experiment; the next full run covers them again.
        if: needs.changes.outputs.labs-only != 'true'
      # axe over the served pages in both themes: page-level composition
      # (landmarks, heading order, the mounted chrome) that the per-component
      # story gate cannot see. Rule set mirrors .storybook/preview.ts.
      - run: node scripts/validate-website-a11y.mjs
        if: needs.changes.outputs.labs-only != 'true'

