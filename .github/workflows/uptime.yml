# Scheduled synthetic monitoring: the live hydration smoke, every four
# hours. Every other check runs at ship time, but the site can change
# without a deploy — ISR regenerates pages at runtime, which is exactly how
# the 2026-09-06 blank-site outage appeared on a deployment that had shipped
# green. A failed run emails the workflow's last committer (GitHub's default
# for scheduled failures); the fix path is the same as ship's step 8 — treat
# it as an active outage.
#
# GitHub pauses cron workflows after 60 days without repo activity; a push
# revives them. The schedule offsets the hour mark because GitHub delays
# top-of-hour crons under load.
name: Uptime

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live hydration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browser alone, without --with-deps, as in ci.yml: the runner image
      # has Chromium's system libraries, and the apt step that flag adds
      # depends on Ubuntu's archive. When the runners cannot reach it this
      # run would fail and read as a site outage that is not one.
      - run: npx playwright install chromium
      # The origin comes from scripts/brand.mjs, the one home for it. A
      # workflow cannot import a module, so it reads the value at run time
      # rather than restating it — a domain change is then one edit there.
      - run: node scripts/smoke-hydration.mjs "$(node -e 'import("./scripts/brand.mjs").then(m => console.log(m.SITE_URL))')"
