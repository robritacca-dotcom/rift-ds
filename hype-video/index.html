<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rift DS hype reel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: "Inter Tight"; src: url("../src/fonts/presets/inter-tight-300-900-latin.woff2") format("woff2"); font-weight: 300 900; }
  @font-face { font-family: "Plex Mono"; src: url("../src/fonts/presets/ibm-plex-mono-500-latin.woff2") format("woff2"); font-weight: 500; }

  :root { --teal: #0E6E8F; --glow: #2FC4E8; --ink: #050505; --paper: #F4F6F7; --accent: var(--glow); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; cursor: none; }
  body { font-family: "Inter Tight", system-ui, sans-serif; color: #fff; display: grid; place-items: center; }

  /* A fixed 16:9 stage, scaled to the window, so a screen recording frames the same at any size. */
  #stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: var(--ink); transform-origin: center; flex: none; }
  .scene { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .center { display: grid; place-items: center; text-align: center; }

  /* grain + vignette over everything */
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 50;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 40; pointer-events: none; }

  .big { font-weight: 850; letter-spacing: -0.045em; line-height: .92; }
  .word { display: inline-block; margin: 0 .12em; opacity: 0; transform: translateY(40px); }
  .mono { font-family: "Plex Mono", ui-monospace, monospace; }

  /* 1. the crack */
  #crack { position: absolute; inset: 0; }
  #crack path { fill: none; stroke: var(--glow); stroke-width: 4; filter: drop-shadow(0 0 18px var(--glow)) drop-shadow(0 0 60px var(--teal)); }
  #s1 .line { font-size: 120px; position: absolute; left: 0; right: 0; }

  /* 2. logo */
  #logo { font-size: 330px; position: relative; }
  #logo .half { position: absolute; inset: 0; display: grid; place-items: center; }
  #logo .top { clip-path: polygon(0 0, 100% 0, 100% 46%, 0 58%); }
  #logo .bot { clip-path: polygon(0 58%, 100% 46%, 100% 100%, 0 100%); color: var(--glow); }
  #logo .ghost { visibility: hidden; }
  #tagline { font-size: 64px; font-weight: 500; letter-spacing: -0.02em; margin-top: 40px; color: #cfe9f1; }

  /* 3. counter */
  #wall { position: absolute; inset: -60px 0; display: flex; flex-direction: column; justify-content: space-between; opacity: .9; }
  #wall .row { white-space: nowrap; font-size: 54px; font-weight: 700; letter-spacing: -0.02em; color: rgba(255,255,255,.08); will-change: transform; }
  #wall .row span { margin-right: 48px; }
  #wall .row span.hot { color: var(--glow); text-shadow: 0 0 30px var(--teal); }
  #count { font-size: 420px; font-variant-numeric: tabular-nums; position: relative; text-shadow: 0 20px 80px rgba(0,0,0,.8); }
  #countLabel { font-size: 90px; font-weight: 700; position: relative; margin-top: -30px; letter-spacing: -0.03em; }

  /* 4/6/7. screenshots */
  .shot { position: absolute; border-radius: 22px; overflow: hidden; background: #fff;
    box-shadow: 0 60px 140px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.12); }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  #montage .shot { width: 1440px; height: 900px; left: 240px; top: 90px; }
  .chip { position: absolute; left: 120px; bottom: 90px; z-index: 5; font-size: 56px; font-weight: 800; letter-spacing: -0.03em;
    background: var(--glow); color: var(--ink); padding: 14px 34px; border-radius: 999px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }

  /* 5. themes */
  #themes { background: var(--accent); transition: none; }
  #themes .shot { width: 1280px; height: 800px; right: 90px; top: 140px; }
  #themeCopy { position: absolute; left: 110px; top: 200px; width: 560px; }
  #themeCount { font-size: 210px; }
  #themeSub { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; margin-top: 10px; }
  #themeCode { position: absolute; left: 110px; bottom: 120px; font-size: 34px; background: rgba(0,0,0,.82); color: #fff;
    padding: 22px 30px; border-radius: 18px; }
  #themeCode b { color: color-mix(in srgb, var(--accent) 55%, white); font-weight: 500; }

  /* 6. AI */
  #ai { perspective: 2400px; }
  #ai .shot { width: 1200px; height: 750px; }
  #aiTitle { position: absolute; left: 0; right: 0; top: 70px; font-size: 150px; text-align: center; z-index: 5; }
  #aiTitle em { font-style: normal; color: var(--glow); }
  .pill { position: absolute; z-index: 6; font-size: 40px; font-weight: 700; padding: 18px 32px; border-radius: 999px;
    background: rgba(10,30,38,.92); border: 2px solid var(--glow); color: #fff; box-shadow: 0 0 50px rgba(47,196,232,.35); opacity: 0; }

  /* 7. terminal */
  #term { width: 1400px; height: 640px; background: #0b0f11; border-radius: 26px; border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 60px 160px rgba(0,0,0,.8), 0 0 120px rgba(14,110,143,.35); padding: 34px 50px; font-size: 44px; line-height: 1.6; text-align: left; position: relative; }
  #term .dots { display: flex; gap: 14px; margin-bottom: 30px; }
  #term .dots i { width: 20px; height: 20px; border-radius: 50%; background: #333; }
  #term .p { color: var(--glow); }
  #term .ok { color: #7fe3a1; }
  #term .dim { color: #7c8a90; }
  .caret { display: inline-block; width: 24px; height: 46px; background: var(--glow); vertical-align: -8px; }

  /* 8. template grid */
  #grid { display: grid; grid-template-columns: repeat(4, 420px); grid-auto-rows: 262px; gap: 34px; place-content: center; }
  #grid .shot { position: relative; border-radius: 14px; opacity: 0; }
  #gridTitle { position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; font-size: 80px; z-index: 6; text-shadow: 0 10px 40px #000; }

  /* 9. end card */
  #endLogo { font-size: 260px; }
  #endLogo span { color: var(--glow); }
  #endLine { font-size: 58px; font-weight: 600; margin-top: 30px; color: #cfe9f1; letter-spacing: -0.02em; }
  #endCmd { margin-top: 60px; font-size: 46px; padding: 22px 44px; border-radius: 999px; border: 2px solid rgba(255,255,255,.25); display: inline-block; }
  #endUrl { margin-top: 40px; font-size: 52px; font-weight: 800; color: var(--glow); letter-spacing: -0.02em; }

  #hint { position: fixed; inset: auto 0 24px 0; text-align: center; font: 500 15px system-ui; color: #889; z-index: 99; cursor: default; }
  #hint.gone { display: none; }
  #progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--glow); z-index: 99; width: 0; }
  body.recording #progress { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="flash"></div>

  <section class="scene center" id="s1">
    <svg id="crack" viewBox="0 0 1920 1080"><path id="crackPath" d="M-20 820 L420 640 L560 700 L900 470 L1010 540 L1380 300 L1500 350 L1940 120"/></svg>
    <div class="line big" id="l1" style="top:360px"></div>
    <div class="line big" id="l2" style="top:560px; color: var(--glow)"></div>
  </section>

  <section class="scene center" id="s2">
    <div>
      <div id="logo" class="big"><div class="ghost">Rift DS</div><div class="half top">Rift DS</div><div class="half bot">Rift DS</div></div>
      <div id="tagline"></div>
    </div>
  </section>

  <section class="scene center" id="s3">
    <div id="wall"></div>
    <div><div id="count" class="big">0</div><div id="countLabel">components</div></div>
  </section>

  <section class="scene" id="montage"></section>

  <section class="scene" id="themes">
    <div id="themeCopy"><div id="themeCount" class="big"></div><div id="themeSub">themes.<br>One attribute.</div></div>
    <div class="shot"><img id="themeImg" alt=""></div>
    <div id="themeCode" class="mono">&lt;html data-brand="<b id="themeId"></b>"&gt;</div>
  </section>

  <section class="scene" id="ai">
    <div id="aiTitle" class="big">Built for <em>AI</em>.</div>
  </section>

  <section class="scene center" id="s7">
    <div id="term" class="mono"><div class="dots"><i></i><i></i><i></i></div><div id="termBody"></div></div>
  </section>

  <section class="scene" id="s8">
    <div id="grid" style="position:absolute; inset:0"></div>
    <div id="gridTitle" class="big">Whole screens, ready to ship.</div>
  </section>

  <section class="scene center" id="s9">
    <div>
      <div id="endLogo" class="big">Rift <span>DS</span></div>
      <div id="endLine"></div>
      <div id="endCmd" class="mono"></div>
      <div id="endUrl"></div>
    </div>
  </section>
</div>
<div id="hint">Click or press Space to play. F for fullscreen. R to restart. ?loop=1 loops.</div>
<div id="progress"></div>

<script src="data.js"></script>
<script>
/*
 * The whole reel is a pure function of time: render(t) sets every element for
 * second t, so it can be scrubbed (arrow keys) and plays identically every run.
 * Cuts land on a 120 BPM grid (one beat = 0.5 s, one bar = 2 s) so music at
 * 120 BPM lines up in the edit.
 */
const D = window.RIFT;
const $ = (id) => document.getElementById(id);
const DURATION = 32;
const BEAT = 0.5;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 4);
const easeIn = (p) => p * p * p;
const back = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const show = (el, on) => { el.style.opacity = on ? 1 : 0; };
const img = (name) => `shots/${name}.jpg`;

/* ---------- build ---------- */
const words = (el, text) => { el.innerHTML = text.split(' ').map((w) => `<span class="word">${w}</span>`).join(' '); return [...el.children]; };
const L1 = words($('l1'), "You don't need another button.");
const L2 = words($('l2'), 'You need a system.');
const TAG = words($('tagline'), 'The open source AI design system.');

// The wall: every component name, shuffled across rows.
const ROWS = 9;
const names = [...D.components];
const rows = Array.from({ length: ROWS }, (_, r) => names.filter((_, i) => i % ROWS === r));
$('wall').innerHTML = rows.map((r) => `<div class="row">${[...r, ...r, ...r].map((n) => `<span>${n}</span>`).join('')}</div>`).join('');
const wallRows = [...$('wall').children];
const wallSpans = [...$('wall').querySelectorAll('span')];

const MONTAGE = [
  ['c-button', 'Button'], ['c-line-chart', 'Line chart'], ['c-chat-thread', 'Chat thread'], ['c-data-table', 'Data table'],
  ['c-globe', 'Globe'], ['c-tool-call', 'Tool call'], ['c-treemap', 'Treemap'], ['c-gantt-chart', 'Gantt chart'],
].filter(([, label]) => D.components.includes(label));
$('montage').innerHTML = MONTAGE.map(([f, label]) => `<div class="m" style="position:absolute;inset:0;opacity:0"><div class="shot"><img src="${img(f)}" alt=""></div><div class="chip">${label}</div></div>`).join('');
const montage = [...$('montage').children];

const AI_SHOTS = ['t-agent-workbench', 't-chat-home', 'c-tool-call'];
const AI_PILLS = ['Chat widget in one command', 'MCP endpoint, no key', 'Agent skills', 'Every prop, machine-readable'];
$('ai').insertAdjacentHTML('beforeend',
  AI_SHOTS.map((f) => `<div class="shot"><img src="${img(f)}" alt=""></div>`).join('') +
  AI_PILLS.map((p) => `<div class="pill">${p}</div>`).join(''));
const aiShots = [...$('ai').querySelectorAll('.shot')];
const aiPills = [...$('ai').querySelectorAll('.pill')];
const PILL_POS = [[110, 330], [1310, 420], [160, 860], [1150, 900]];

const TEMPLATES = ['t-marketing-dashboard', 't-chat-home', 't-agent-workbench', 't-sales-pipeline', 't-landing-page', 't-team-calendar', 't-roadmap-planner', 't-sign-in'];
$('grid').innerHTML = TEMPLATES.map((f) => `<div class="shot"><img src="${img(f)}" alt=""></div>`).join('');
const gridShots = [...$('grid').children];

const TERM = [
  ['p', `$ npx ${D.packageName} init`],
  ['ok', '✓ Agent skills installed'],
  ['ok', '✓ AGENTS.md written'],
  ['dim', `  ${D.components.length} components, typed and documented`],
  ['p', `$ npx ${D.packageName} chat`],
  ['ok', '✓ Chat widget scaffolded'],
];

$('themeCount').textContent = D.themes.length;
D.themes.forEach((th) => { const i = new Image(); i.src = img('theme-' + th.id); });
$('endLine').textContent = `${D.components.length} components. ${D.themes.length} themes. Free and MIT.`;
$('endCmd').textContent = `npm i ${D.packageName}`;
$('endUrl').textContent = D.siteUrl.replace(/^https?:\/\//, '');

/* ---------- timeline ---------- */
const SCENES = [
  ['s1', 0, 4], ['s2', 4, 8], ['s3', 8, 12], ['montage', 12, 16],
  ['themes', 16, 20], ['ai', 20, 24], ['s7', 24, 26], ['s8', 26, 28], ['s9', 28, DURATION],
];

function shake(t, at, amount = 30, len = 0.35) {
  const p = prog(t, at, at + len);
  if (p <= 0 || p >= 1) return '';
  const a = amount * (1 - p);
  return `translate(${Math.sin(t * 90) * a}px, ${Math.cos(t * 70) * a}px)`;
}

function wordsIn(ws, t, start, step = BEAT / 2) {
  ws.forEach((w, i) => {
    const p = easeOut(prog(t, start + i * step, start + i * step + 0.25));
    w.style.opacity = p;
    w.style.transform = `translateY(${(1 - p) * 40}px) scale(${lerp(1.3, 1, p)})`;
    w.style.filter = `blur(${(1 - p) * 10}px)`;
  });
}

function render(t) {
  for (const [id, a, b] of SCENES) show($(id), t >= a && t < b);
  
  // flash on every section downbeat
  let flash = 0;
  for (const at of [0, 4, 8, 12, 16, 20, 24, 28]) if (t >= at && t > 0.01) flash = Math.max(flash, 1 - prog(t, at, at + (at === 4 || at === 28 ? 0.5 : 0.18)));
  $('flash').style.opacity = flash * (t >= 4 && t < 4.5 || t >= 28 ? 0.95 : 0.35);

  /* 1. crack + lines */
  if (t < 4) {
    const path = $('crackPath');
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len * (1 - easeOut(prog(t, 0, 0.45)));
    path.style.opacity = lerp(1, 0.35, prog(t, 0.6, 1.5)) + prog(t, 3.2, 3.9) * 0.65;
    path.style.strokeWidth = 4 + easeIn(prog(t, 3.0, 4)) * 60;
    wordsIn(L1, t, 0.5);
    wordsIn(L2, t, 2.0, BEAT / 2);
    $('l1').style.opacity = 1 - prog(t, 1.9, 2.1) * 0.75;
    $('s1').style.transform = `scale(${lerp(1, 1.12, easeIn(prog(t, 2, 4)))}) ${shake(t, 0, 20)}`;
  }

  /* 2. logo slam */
  if (t >= 4 && t < 8) {
    const p = prog(t, 4, 4.35);
    const split = (1 - easeOut(prog(t, 4, 4.5))) * 160 + Math.max(0, Math.sin((t - 4.5) * 8) * 4) * (1 - prog(t, 4.5, 6));
    const logo = $('logo');
    logo.style.transform = `scale(${lerp(2.4, 1, back(p))}) ${shake(t, 4.25, 40, 0.5)}`;
    logo.style.opacity = clamp(p * 3);
    logo.querySelector('.top').style.transform = `translate(${-split}px, ${-split * 0.35}px)`;
    logo.querySelector('.bot').style.transform = `translate(${split}px, ${split * 0.35}px)`;
    wordsIn(TAG, t, 5.5, BEAT / 4);
    $('s2').style.transform = `scale(${lerp(1, 0.92, prog(t, 6, 8))})`;
  }

  /* 3. counter + wall */
  if (t >= 8 && t < 12) {
    const n = Math.round(D.components.length * easeOut(prog(t, 8, 10.5)));
    $('count').textContent = n;
    $('count').style.transform = `scale(${1 + (t > 10.5 && t < 10.8 ? (1 - prog(t, 10.5, 10.8)) * 0.15 : 0)})`;
    wallRows.forEach((r, i) => { const dir = i % 2 ? 1 : -1; r.style.transform = `translateX(${dir * (t - 8) * (120 + i * 25) - (dir > 0 ? 1500 : 200)}px)`; });
    const beat = Math.floor((t - 8) / (BEAT / 2));
    wallSpans.forEach((s, i) => s.classList.toggle('hot', (i * 37 + beat * 11) % 23 === 0));
    $('s3').style.transform = shake(t, 10.5, 18, 0.3);
  }

  /* 4. montage, one shot per beat */
  if (t >= 12 && t < 16) {
    const idx = Math.min(montage.length - 1, Math.floor((t - 12) / BEAT));
    montage.forEach((m, i) => {
      const on = i === idx;
      m.style.opacity = on ? 1 : 0;
      if (!on) return;
      const lt = (t - 12) - i * BEAT;
      const p = easeOut(clamp(lt / 0.2));
      const dir = i % 2 ? 1 : -1;
      m.querySelector('.shot').style.transform = `translateX(${(1 - p) * dir * 220}px) scale(${lerp(1.12, 1, p) + lt * 0.04}) rotate(${(1 - p) * dir * 3}deg)`;
      m.querySelector('.chip').style.transform = `translateY(${(1 - easeOut(clamp((lt - 0.05) / 0.2))) * 60}px)`;
    });
  }

  /* 5. themes: three swaps a beat, background takes each theme's key colour */
  if (t >= 16 && t < 20) {
    const step = 4 / D.themes.length;
    const idx = Math.min(D.themes.length - 1, Math.floor((t - 16) / step));
    const th = D.themes[idx];
    const el = $('themes');
    el.style.setProperty('--accent', th.brand);
    const light = parseInt(th.brand.slice(1, 3), 16) * .299 + parseInt(th.brand.slice(3, 5), 16) * .587 + parseInt(th.brand.slice(5, 7), 16) * .114 > 150;
    el.style.color = light ? '#050505' : '#fff';
    const src = img('theme-' + th.id);
    if (!$('themeImg').src.endsWith(src)) $('themeImg').src = src;
    $('themeId').textContent = th.id;
    const lt = (t - 16) - idx * step;
    $('themes').querySelector('.shot').style.transform = `scale(${lerp(1.04, 1, easeOut(clamp(lt / 0.15)))})`;
    const p = easeOut(prog(t, 16, 16.4));
    $('themeCopy').style.transform = `translateX(${(1 - p) * -120}px)`;
    $('themeCopy').style.opacity = p;
  }

  /* 6. AI: a fanned stack of screens, pills on the beat */
  if (t >= 20 && t < 24) {
    const p = easeOut(prog(t, 20, 20.6));
    const drift = (t - 20) * 3;
    aiShots.forEach((s, i) => {
      const k = i - 1;
      const x = 360 + k * 260 * p, y = 250 + Math.abs(k) * 40 - k * 10;
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.zIndex = 3 - Math.abs(k);
      s.style.transform = `rotateY(${k * -14 * p - drift + 6}deg) rotateX(${8 * p}deg) translateZ(${-Math.abs(k) * 200}px) scale(${lerp(0.7, 0.92, p)})`;
      s.style.opacity = clamp(p * 2);
    });
    const tp = easeOut(prog(t, 20, 20.3));
    $('aiTitle').style.transform = `scale(${lerp(1.6, 1, tp)})`;
    $('aiTitle').style.opacity = tp;
    aiPills.forEach((pl, i) => {
      const pp = back(prog(t, 21 + i * BEAT, 21.3 + i * BEAT));
      pl.style.opacity = clamp(pp);
      pl.style.left = PILL_POS[i][0] + 'px'; pl.style.top = PILL_POS[i][1] + 'px';
      pl.style.transform = `scale(${pp})`;
    });
  }

  /* 7. terminal */
  if (t >= 24 && t < 26) {
    const lt = t - 24;
    let out = '';
    const timing = [[0, 0.5], [0.6, 0], [0.75, 0], [0.9, 0], [1.05, 0.4], [1.5, 0]];
    TERM.forEach(([cls, text], i) => {
      const [at, typeDur] = timing[i];
      if (lt < at) return;
      const shown = typeDur ? text.slice(0, Math.ceil(text.length * clamp((lt - at) / typeDur))) : text;
      out += `<div class="${cls}">${shown}</div>`;
    });
    const caret = Math.floor(lt * 4) % 2 ? '' : '<span class="caret"></span>';
    $('termBody').innerHTML = out + caret;
    const p = easeOut(prog(t, 24, 24.3));
    $('term').style.transform = `scale(${lerp(0.85, 1, p)}) ${shake(t, 24, 10, 0.2)}`;
  }

  /* 8. template grid pops on the eighth notes */
  if (t >= 26 && t < 28) {
    gridShots.forEach((g, i) => {
      const p = back(prog(t, 26 + i * BEAT / 4, 26.25 + i * BEAT / 4));
      g.style.opacity = clamp(p);
      g.style.transform = `scale(${p}) rotate(${(1 - clamp(p)) * (i % 2 ? 6 : -6)}deg)`;
    });
    $('grid').style.transform = `scale(${lerp(1, 1.08, prog(t, 26, 28))})`;
    $('gridTitle').style.opacity = easeOut(prog(t, 27, 27.25));
  }

  /* 9. end card */
  if (t >= 28) {
    const p = back(prog(t, 28, 28.4));
    $('endLogo').style.transform = `scale(${lerp(2, 1, p)}) ${shake(t, 28.2, 30, 0.5)}`;
    $('endLogo').style.opacity = clamp(p * 2);
    const fade = (el, at) => { const q = easeOut(prog(t, at, at + 0.35)); el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * 30}px)`; };
    fade($('endLine'), 29); fade($('endCmd'), 29.5); fade($('endUrl'), 30);
  }

  $('progress').style.width = (t / DURATION * 100) + '%';
}

/* ---------- playback ---------- */
const LOOP = new URLSearchParams(location.search).has('loop');
let start = null, paused = true, at = 0;
function frame(now) {
  if (!paused) {
    at = (now - start) / 1000;
    if (at >= DURATION) { if (LOOP) { start = now; at = 0; } else { at = DURATION - 0.001; paused = true; } }
  }
  render(at);
  requestAnimationFrame(frame);
}
function play() { $('hint').classList.add('gone'); document.body.classList.add('recording'); paused = false; start = performance.now() - at * 1000; }
function toggle() { if (at >= DURATION - 0.01) at = 0; paused ? play() : (paused = true); }
addEventListener('click', toggle);
addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  if (e.key === 'r') { at = 0; start = performance.now(); }
  if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (e.key === 'ArrowRight') { at = Math.min(DURATION - 0.01, at + BEAT); start = performance.now() - at * 1000; }
  if (e.key === 'ArrowLeft') { at = Math.max(0, at - BEAT); start = performance.now() - at * 1000; }
});
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
// ?t=12 opens paused on second 12, for checking a frame.
const seek = parseFloat(new URLSearchParams(location.search).get('t'));
if (!isNaN(seek)) at = seek;
requestAnimationFrame(frame);
</script>
</body>
